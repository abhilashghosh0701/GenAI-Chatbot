nameOverride: frontend

disableDeployment: false

image:
  registry: its-docker.artifactory.mocca.yunextraffic.cloud
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: artifactorypullsecret

podAnnotations:
  checksum/config: '{{ tpl ($.Files.Get "config/config.json") $ | sha256sum }}'

podPorts:
  - name: http
    containerPort: 8080
    protocol: TCP

storageClassName: vsphere-csi-sc

# Resources needed to deploy on Kubernetes cluster. Increase/decrease as per your need.
resources:
  requests:
    cpu: 250m
    memory: 128Mi
  limits:
    memory: 512Mi

service:
  enabled: true
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 3000
      protocol: TCP
      name: http

gateway:
  enabled: true
  allowInsecureProtocols: false
  servers:
    - port:
        name: '{{ not $.Values.gateway.allowInsecureProtocols | ternary "https" "http" }}'
        number: '{{ not $.Values.gateway.allowInsecureProtocols | ternary "443" "80" }}'
        protocol: '{{ not $.Values.gateway.allowInsecureProtocols | ternary "HTTPS" "HTTP" }}'
      customHosts:
        - '{{- .Values.serviceHost -}}.{{- include "yunex-app.baseDomain" . -}}'
        - '{{- empty .Values.redirectedServiceHost | ternary .Values.serviceHost .Values.redirectedServiceHost -}}.{{- include "yunex-app.baseDomain" . -}}'

virtualservice:
  enabled: true
  customHosts:
    - '{{- .Values.serviceHost -}}.{{- include "yunex-app.baseDomain" . -}}'
    - '{{- empty .Values.redirectedServiceHost | ternary .Values.serviceHost .Values.redirectedServiceHost -}}.{{- include "yunex-app.baseDomain" . -}}'

batch:
  enabled: false

volumesFromFileConfigMap:
  frontend:
    defaultMode: 0666
    mountPath: /opt/mos-frame/assets/config.json
    subPath: config.json
    files:
      - name: config.json
        path: config/config.json

sideContainerOauth2:
  enabled: true
  image:
    registry: quay.artifactory.mocca.yunextraffic.cloud
    repository: oauth2-proxy/oauth2-proxy
    tag: v7.9.0
    pullPolicy: IfNotPresent
  httpAddressPort: 3000
  upstreamPort: 8080

