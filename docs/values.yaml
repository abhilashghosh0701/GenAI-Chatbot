      source: prometheus

# Theme available in SAF
availableThemes:
  enabled: false # By default theme is disable. It can be turned on by setting True
  default: autodetect # Default theme is auto-detect. 
  list: #List of theme supported in SAF
  - light
  - dark
  - autodetect

