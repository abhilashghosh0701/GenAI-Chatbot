# List of all the languages supported in SAF
availableLocales:
  default:
    language: en # The default language is English
    country:
  # List of supported locale in SAF    
  list:
    - language: en
      value: language.en_US 
      country: US
    - language: en
      value: language.en
      country:
    - language: de
      value: language.de
      country: DE
    - language: it
      value: language.it
      country: IT
    - language: fr
      value: language.fr
      country: FR
    - language: es
      value: language.es
      country: ES
    - language: pl
      value: language.pl
      country: PL
    - language: cs
      value: language.cs
      country: CZ

menuSplitIndex: 5
faviconType: symphony
analytics:
  pageTransitionDelay: 2000
  apiBaseDomain: https://web-analytics.{{ include "yunex-app.baseDomain" . }}

helpUrl: https://help.{{ include "yunex-app.baseDomain" . }}

enabledActionCenterFeature: true # To enabled/disable Action Center integration
enabledMuteFeature: true #To enabled/disable Mute feature. When on, all notifications in action-center will be silenced.
enabledSearchFeature: true #To enabled/disable quick module search

# Entry modules that are not default in SAF, can be configured here. When accessing extra module, it always open in new tab in the browser
extra:
  modules: [] #Additional modules or 3rd party modules can be added here. It should contains id, type, url, icon and permission.
  defaultModulesOrder: []
